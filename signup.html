<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ausway - Sign-up</title><link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/signup.css"></head>
<body data-page="signup"><div class="auth sc"><img class="lg" src="assets/logo.png" alt="Ausway logo"><div class="su"><div class="fg"><div class="fl">First Name</div><input class="tx" id="fn" type="text" placeholder="Enter Your First Name" autocomplete="off" ></div><div class="fg"><div class="fl">Last Name</div><input class="tx" id="ln" type="text" placeholder="Enter Your Last Name" autocomplete="off" ></div><div class="fg"><div class="fl">Gender</div><div class="gender"><label class="gopt"><input class="ck" type="checkbox" name="gender" value="MALE" aria-label="Male"><span class="gl">MALE</span></label><label class="gopt"><input class="ck" type="checkbox" name="gender" value="FEMALE" aria-label="Female"><span class="gl">FEMALE</span></label><label class="gopt"><input class="ck" type="checkbox" name="gender" value="OTHERS" aria-label="Others"><span class="gl">OTHERS</span></label></div></div><div class="fg"><div class="fl">Date of Birth</div><div class="dob"><input class="dt" id="dd" placeholder="dd" inputmode="numeric" maxlength="2" autocomplete="off"><span class="sl">/</span><input class="dt" id="mm" placeholder="mm" inputmode="numeric" maxlength="2" autocomplete="off"><span class="sl">/</span><input class="dt wide" id="yyyy" placeholder="yyyy" inputmode="numeric" maxlength="4" autocomplete="off"></div></div><div class="fg"><div class="fl">Emergency contact</div><input class="tx" id="ec" type="text" placeholder="Enter emergency contact" autocomplete="off" inputmode="numeric" maxlength="10"></div><div class="fg"><div class="fl">Current Address</div><input class="tx" id="ca1" type="text" placeholder="Enter your House or Building No. / Street Name" autocomplete="off" ><input class="tx" id="ca2" type="text" placeholder="Enter your Area / City" autocomplete="off" ><input class="tx" id="cpin" type="text" placeholder="Enter Pin Code" autocomplete="off" inputmode="numeric" maxlength="6"></div><div class="fg"><div class="fl">Permanent Address</div><div class="samerow"><input class="rad" id="same" type="radio" aria-label="Same as current address"><span id="sameLbl">Same as current address</span></div><input class="tx" id="pa1" type="text" placeholder="Enter your House or Building No. / Street Name" autocomplete="off" ><input class="tx" id="pa2" type="text" placeholder="Enter your Area / City" autocomplete="off" ><input class="tx" id="ppin" type="text" placeholder="Enter Pin Code" autocomplete="off" inputmode="numeric" maxlength="6"></div><div class="fg"><div class="fl">Aadhar</div><label class="up" id="upA"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M4 13v7h16v-7"/></svg><span class="fn">Upload Aadhar</span><input type="file" id="fA" accept="image/*,.pdf"  hidden></label></div><div class="fg"><div class="fl">Shop License</div><label class="up" id="upL"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M4 13v7h16v-7"/></svg><span class="fn">Upload License</span><input type="file" id="fL" accept="image/*,.pdf"  hidden></label></div><div class="fg"><div class="fl">Photo</div><label class="ph" id="upP"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5h4l1.6-2.5h4.8L15 8.5h4v11H3z"/><circle cx="11" cy="14" r="3.4"/><path d="M19 2.5v6M16 5.5h6"/></svg><span class="fn">Click a current picture</span><input type="file" id="fP" accept="image/*" capture="user" hidden></label></div><div class="amsg" id="msg"></div><button class="pbtn" id="confirm">CONFIRM</button></div></div><script src="js/app.js"></script></body></html>
