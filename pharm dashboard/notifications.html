<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AUSWAY - Notifications</title>

    <style>
        /* =====================================================
   RESET
   ===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    min-height: 100%;
}


body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #ffffff;

    color: #3f3f3f;

    overflow-x: hidden;
}


/* =====================================================
   HEADER
   ===================================================== */

.top-header {

    height: 101px;

    width: 100%;

    background: #9d3535;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 50px 0 52px;
}


/* =====================================================
   BRAND
   ===================================================== */

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}


.brand-logo {

    width: 64px;

    height: 64px;

    object-fit: contain;

    display: block;
}


.brand-name {

    color: #ffffff;

    font-size: 34px;

    font-weight: 700;

    letter-spacing: -0.5px;
}


/* =====================================================
   HEADER RIGHT
   ===================================================== */

.header-right {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
}



/* =====================================================
   PROFILE BUTTON
   ===================================================== */

.profile-button {

    width: 250px;

    height: 61px;

    border: none;

    border-radius: 35px;

    background: #ffffff;

    color: #444444;

    display: flex;

    align-items: center;

    padding: 0 17px;

    gap: 17px;

    cursor: pointer;

    font-size: 23px;
}


.profile-icon {

    width: 42px;

    height: 42px;

    border: 4px solid #8f1616;

    border-radius: 50%;

    color: #8f1616;

    display: flex;

    align-items: center;

    justify-content: center;
}


.profile-icon svg {

    width: 30px;

    height: 30px;
}


.profile-name {

    flex: 1;

    text-align: left;

    white-space: nowrap;
}


.profile-arrow {

    width: 25px;

    height: 25px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.profile-arrow svg {

    width: 22px;

    height: 22px;
}


/* =====================================================
   SETTINGS
   ===================================================== */

.settings-button {
    width: 52px;
    height: 52px;

    border: none;
    background: transparent;

    color: #ffffff;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    margin: 0;

    outline: none;
}


.settings-button svg {
    width: 43px;
    height: 43px;

    display: block;
}


/* =====================================================
   MAIN PAGE
   ===================================================== */

.main-page {

    min-height: calc(100vh - 101px);

    background: #ffffff;

    margin: 0 20px;

    position: relative;

    padding-top: 28px;
}


/* =====================================================
   PAGE TOP
   ===================================================== */

.page-top {

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 28px 0 38px;
}


/* =====================================================
   TITLE
   ===================================================== */

.page-title {

    display: flex;

    align-items: center;

    gap: 16px;
}


.page-title h1 {

    font-size: 30px;

    font-weight: 700;

    color: #444444;
}


.back-button {

    width: 30px;

    height: 40px;

    border: none;

    background: transparent;

    cursor: pointer;

    color: #222222;

    display: flex;

    align-items: center;

    justify-content: center;
}


.back-button svg {

    width: 29px;

    height: 29px;
}


/* =====================================================
   SEARCH AREA
   ===================================================== */

.search-area {

    width: 630px;

    height: 81px;

    background: #ffe0e0;

    border-radius: 21px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0 25px;
}


.search-box {

    width: 100%;

    height: 52px;

    background: #ffffff;

    border-radius: 18px;

    display: flex;

    align-items: center;

    padding: 0 28px;

    box-shadow:
        0 3px 6px
        rgba(0, 0, 0, 0.20);
}


.search-icon {

    width: 31px;

    height: 31px;

    color: #bdbdbd;

    flex-shrink: 0;
}


.search-box input {

    width: 100%;

    height: 100%;

    border: none;

    outline: none;

    background: transparent;

    padding-left: 22px;

    font-size: 17px;

    color: #444444;
}


.search-box input::placeholder {

    color: #999999;

    opacity: 1;
}


/* =====================================================
   NOTIFICATION SECTION
   ===================================================== */

.notification-section {

    width: 1050px;

    margin: 90px auto 0;

    position: relative;
}


/* =====================================================
   TABS
   ===================================================== */

.tabs {

    height: 38px;

    display: flex;

    align-items: flex-end;

    gap: 26px;

    padding-left: 38px;

    position: relative;

    z-index: 2;
}


.tab {

    width: 130px;

    height: 38px;

    border: none;

    background: transparent;

    color: #111111;

    font-size: 21px;

    cursor: pointer;

    border-radius:
        20px 20px 0 0;

    position: relative;
}


.tab.active {

    background: #ffe0e0;
}


/* =====================================================
   NOTIFICATION CARD
   ===================================================== */

.notification-card {

    width: 100%;

    min-height: 450px;

    background: #ffe0e0;

    border-radius: 21px;

    padding:
        13px 25px 25px;

    position: relative;

    z-index: 1;
}


/* =====================================================
   INDIVIDUAL NOTIFICATION
   ===================================================== */

.notification-item {

    width: 100%;

    border-bottom: 1px solid #a9a9a9;

    position: relative;
}


.notification-item:last-child {

    border-bottom: none;
}


/* =====================================================
   NOTIFICATION MAIN ROW
   ===================================================== */

.notification-main {

    min-height: 69px;

    display: flex;

    align-items: center;

    cursor: pointer;

    position: relative;

    padding: 5px 0;
}


.notification-main:hover {

    background: rgba(255, 255, 255, 0.15);
}


/* =====================================================
   ICON
   ===================================================== */

.notification-icon {

    width: 42px;

    min-width: 42px;

    height: 42px;

    margin-right: 12px;

    color: #a63636;

    display: flex;

    align-items: center;

    justify-content: center;
}


.notification-icon svg {

    width: 29px;

    height: 29px;

    display: block;
}


/* =====================================================
   NOTIFICATION TEXT
   ===================================================== */

.notification-text {

    min-width: 0;

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;
}


.notification-title {

    font-size: 17px;

    font-weight: 700;

    color: #3e3e3e;

    line-height: 1.25;
}


.notification-description {

    margin-top: 3px;

    font-size: 16px;

    color: #999999;

    line-height: 1.25;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   TIME
   ===================================================== */

.notification-time {

    width: 150px;

    flex-shrink: 0;

    text-align: left;

    font-size: 16px;

    color: #3f3f3f;
}


/* =====================================================
   MORE BUTTON
   ===================================================== */

.more-button {

    width: 32px;

    height: 40px;

    flex-shrink: 0;

    border: none;

    background: transparent;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;
}


.more-button span {

    width: 4px;

    height: 4px;

    background: #222222;

    border-radius: 50%;

    box-shadow:
        0 -7px 0 #222222,
        0 7px 0 #222222;
}


/* =====================================================
   UNREAD
   ===================================================== */

.notification-item.unread
.notification-title {

    font-weight: 700;
}


/* =====================================================
   IMPORTANT
   ===================================================== */

.notification-item.important
.notification-title::after {

    content: " ";

}


/* =====================================================
   EXPANDED MESSAGE
   ===================================================== */

.notification-details {

    display: none;

    margin:
        0 50px 13px 54px;

    padding:
        11px 15px;

    background: rgba(255, 255, 255, 0.60);

    border-left:
        3px solid #a63636;

    border-radius: 8px;

    color: #686868;

    font-size: 14px;

    line-height: 1.45;
}


.notification-item.expanded
.notification-details {

    display: block;
}


/* =====================================================
   EMPTY MESSAGE
   ===================================================== */

.no-results {

    min-height: 300px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #777777;

    font-size: 18px;
}


/* =====================================================
   PAGINATION
   ===================================================== */

.pagination {

    position: absolute;

    right: 29px;

    bottom: 26px;

    display: flex;

    align-items: center;

    gap: 18px;

    font-size: 22px;
}


.page-arrow,
.page-number {

    border: none;

    background: transparent;

    color: #3d3d3d;

    font-size: 21px;

    cursor: pointer;

    padding: 3px;
}


.page-arrow:hover,
.page-number:hover {

    color: #9d3535;
}


.active-page {

    font-weight: 700;
}


.page-dots {

    color: #444444;

    letter-spacing: 2px;
}


/* =====================================================
   SMALL RESPONSIVE SUPPORT
   ===================================================== */

@media (max-width: 1200px) {

    .search-area {

        width: 500px;
    }


    .notification-section {

        width: 85%;
    }

}


@media (max-width: 900px) {

    .top-header {

        padding: 0 25px;
    }


    .header-right {

        gap: 20px;
    }


    .profile-button {

        width: 190px;
    }


    .profile-name {

        font-size: 18px;
    }


    .search-area {

        width: 400px;
    }


    .notification-time {

        width: 110px;
    }

}


@media (max-width: 700px) {

    .top-header {

        height: auto;

        min-height: 85px;

        padding: 12px 20px;

        flex-wrap: wrap;

        gap: 15px;
    }


    .brand-logo {

        width: 50px;

        height: 50px;
    }


    .brand-name {

        font-size: 27px;
    }


    .header-right {

        gap: 10px;
    }


    .profile-button {

        width: 170px;

        height: 50px;

        font-size: 17px;
    }


    .settings-button {

        width: 42px;

        height: 42px;
    }


    .page-top {

        flex-direction: column;

        align-items: stretch;

        gap: 25px;

        padding: 0 20px;
    }


    .search-area {

        width: 100%;
    }


    .notification-section {

        width: calc(100% - 30px);

        margin-top: 60px;
    }


    .tabs {

        padding-left: 5px;

        gap: 5px;
    }


    .tab {

        width: 100px;

        font-size: 17px;
    }


    .notification-time {

        width: 85px;

        font-size: 12px;
    }


    .notification-description {

        font-size: 13px;
    }


    .notification-title {

        font-size: 14px;
    }


    .notification-icon {

        width: 32px;

        min-width: 32px;
    }


    .notification-icon svg {

        width: 23px;

        height: 23px;
    }


    .pagination {

        position: relative;

        right: auto;

        bottom: auto;

        justify-content: flex-end;

        margin:
            40px 20px 20px;
    }

}
/* =====================================================
   NOTIFICATION THREE-DOT MENU
   ===================================================== */

.notification-menu-wrapper {
    position: relative;

    width: 40px;
    min-width: 40px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* THREE DOT BUTTON */

.more-button {
    width: 35px;
    height: 42px;

    border: none;
    background: transparent;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    position: relative;
    z-index: 10;
}


.more-button span {
    width: 4px;
    height: 4px;

    background: #222222;

    border-radius: 50%;

    display: block;

    box-shadow:
        0 -7px 0 #222222,
        0 7px 0 #222222;
}


/* =====================================================
   DROPDOWN MENU
   ===================================================== */

.notification-menu {
    position: absolute;

    top: 38px;
    right: 5px;

    width: 155px;

    background: #ffffff;

    border-radius: 8px;

    box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.20);

    padding: 6px 0;

    display: none;

    z-index: 100;
}


/* SHOW MENU */

.notification-menu.show {
    display: block;
}


/* MENU BUTTONS */

.notification-menu button {
    width: 100%;
    height: 38px;

    border: none;

    background: transparent;

    text-align: left;

    padding: 0 15px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 14px;

    color: #3f3f3f;

    cursor: pointer;
}


/* HOVER */

.notification-menu button:hover {
    background: #ffe4e4;
}


/* DELETE */

.notification-menu .delete-option {
    color: #a63636;
}


/* KEEP MENU ABOVE OTHER ROWS */

.notification-item.menu-open {
    z-index: 20;
}
    </style>

</head>

/* =====================================================
   DISPLAY NOTIFICATIONS
   ===================================================== */

function renderNotifications() {

    const searchTerm =
        searchInput.value
            .trim()
            .toLowerCase();


    let filteredNotifications =
        notifications.filter(function (notification) {


            /* FILTER */

            if (currentFilter === "unread") {

                if (!notification.unread) {
                    return false;
                }

            }


            if (currentFilter === "important") {

                if (!notification.important) {
                    return false;
                }

            }


            /* SEARCH */

            if (searchTerm !== "") {

                const searchableText = (

                    notification.title +
                    " " +
                    notification.description +
                    " " +
                    notification.details

                ).toLowerCase();


                if (
                    !searchableText.includes(searchTerm)
                ) {

                    return false;

                }

            }


            return true;

        });


    /* =================================================
       EMPTY RESULT
       ================================================= */

    if (filteredNotifications.length === 0) {

        notificationList.innerHTML = `
            <div class="no-results">
                No notifications found
            </div>
        `;

        return;
    }


    /* =================================================
       CREATE HTML
       ================================================= */

    notificationList.innerHTML =
        filteredNotifications
            .map(function (notification) {

                return `

                    <div
                        class="
                            notification-item
                            ${notification.unread ? "unread" : ""}
                            ${notification.important ? "important" : ""}
                        "
                        data-id="${notification.id}"
                    >

                        <div
                            class="notification-main"
                            data-id="${notification.id}"
                        >

                            <div class="notification-icon">

                                ${getIcon(notification.type)}

                            </div>


                            <div class="notification-text">

                                <div class="notification-title">

                                    ${notification.title}

                                </div>


                                <div class="notification-description">

                                    ${notification.description}

                                </div>

                            </div>


                            <div class="notification-time">

                                ${notification.time}

                            </div>

<div class="notification-menu-wrapper">

    <button
        type="button"
        class="more-button"
        data-more="${notification.id}"
        aria-label="More options"
    >
        <span></span>
    </button>

    <div
        class="notification-menu"
        data-menu="${notification.id}"
    >

        <button
            type="button"
            data-action="archive"
            data-id="${notification.id}"
        >
            Archive
        </button>

        <button
            type="button"
            data-action="unread"
            data-id="${notification.id}"
        >
            Mark as unread
        </button>

        <button
            type="button"
            class="delete-option"
            data-action="delete"
            data-id="${notification.id}"
        >
            Delete
        </button>

    </div>

</div>

                        </div>


                        <!-- SMALL EXPANDED AREA -->

                        <div class="notification-details">

                            ${notification.details}

                        </div>

                    </div>

                `;

            })
            .join("");


    attachNotificationEvents();

}


/* =====================================================
   NOTIFICATION EVENTS
   ===================================================== */

function attachNotificationEvents() {

    /* =====================================================
       NOTIFICATION CLICK
       ===================================================== */

    document.querySelectorAll(".notification-item").forEach(item => {

        item.addEventListener("click", function (event) {

            // Don't expand when clicking three-dot menu
            if (event.target.closest(".notification-menu-wrapper")) {
                return;
            }

            this.classList.toggle("expanded");

        });

    });


    /* =====================================================
       THREE-DOT MENU
       ===================================================== */

    document.querySelectorAll(".more-button").forEach(button => {

        button.addEventListener("click", function (event) {

            event.stopPropagation();

            const id = this.dataset.more;

            const wrapper = this.closest(".notification-menu-wrapper");
            const menu = wrapper.querySelector(
                `.notification-menu[data-menu="${id}"]`
            );

            // Close all other menus
            document.querySelectorAll(".notification-menu").forEach(otherMenu => {

                if (otherMenu !== menu) {
                    otherMenu.classList.remove("show");

                    const otherItem =
                        otherMenu.closest(".notification-item");

                    if (otherItem) {
                        otherItem.classList.remove("menu-open");
                    }
                }

            });

            // Toggle current menu
            menu.classList.toggle("show");

            const notificationItem =
                this.closest(".notification-item");

            if (menu.classList.contains("show")) {
                notificationItem.classList.add("menu-open");
            } else {
                notificationItem.classList.remove("menu-open");
            }

        });

    });


    /* =====================================================
       ARCHIVE / UNREAD / DELETE
       ===================================================== */

    document.querySelectorAll(".notification-menu button").forEach(actionButton => {

        actionButton.addEventListener("click", function (event) {

            event.stopPropagation();

            const action = this.dataset.action;
            const id = this.dataset.id;

            const notificationIndex = notifications.findIndex(
                notification => String(notification.id) === String(id)
            );

            if (notificationIndex === -1) {
                return;
            }


            /* =========================
               ARCHIVE
               ========================= */

            if (action === "archive") {

                notifications.splice(notificationIndex, 1);

                renderNotifications();

                return;
            }


            /* =========================
               MARK AS UNREAD
               ========================= */

            if (action === "unread") {

                notifications[notificationIndex].unread = true;

                renderNotifications();

                return;
            }


            /* =========================
               DELETE
               ========================= */

            if (action === "delete") {

                notifications.splice(notificationIndex, 1);

                renderNotifications();

                return;
            }

        });

    });


    /* =====================================================
       CLOSE MENU WHEN CLICKING OUTSIDE
       ===================================================== */

    document.addEventListener("click", function (event) {

        if (!event.target.closest(".notification-menu-wrapper")) {

            document.querySelectorAll(".notification-menu").forEach(menu => {
                menu.classList.remove("show");
            });

            document.querySelectorAll(".notification-item").forEach(item => {
                item.classList.remove("menu-open");
            });

        }

    });

}


/* =====================================================
   TAB FILTER
   ===================================================== */

tabs.forEach(function (tab) {

    tab.addEventListener(
        "click",
        function () {


            tabs.forEach(function (item) {

                item.classList.remove(
                    "active"
                );

            });


            tab.classList.add(
                "active"
            );


            currentFilter =
                tab.dataset.filter;


            currentPage = 1;


            renderNotifications();

        }
    );

});


/* =====================================================
   SEARCH
   ===================================================== */

searchInput.addEventListener(
    "input",
    function () {

        renderNotifications();

    }
);


/* =====================================================
   PAGINATION
   ===================================================== */

pageNumbers.forEach(function (button) {

    button.addEventListener(
        "click",
        function () {

            pageNumbers.forEach(
                function (page) {

                    page.classList.remove(
                        "active-page"
                    );

                }
            );


            button.classList.add(
                "active-page"
            );


            currentPage =
                Number(
                    button.dataset.page
                );


            /*
               Later we can connect
               real database pagination here.
            */

        }
    );

});


/* =====================================================
   PREVIOUS PAGE
   ===================================================== */

previousPage.addEventListener(
    "click",
    function () {

        if (currentPage > 1) {

            currentPage--;

            updateActivePage();

        }

    }
);


/* =====================================================
   NEXT PAGE
   ===================================================== */

nextPage.addEventListener(
    "click",
    function () {

        if (currentPage < 999) {

            currentPage++;

            updateActivePage();

        }

    }
);


/* =====================================================
   UPDATE ACTIVE PAGE
   ===================================================== */

function updateActivePage() {

    pageNumbers.forEach(
        function (page) {

            page.classList.remove(
                "active-page"
            );

        }
    );


    const matchingPage =
        document.querySelector(
            `.page-number[data-page="${currentPage}"]`
        );


    if (matchingPage) {

        matchingPage.classList.add(
            "active-page"
        );

    }

}


/* =====================================================
   BACK BUTTON
   ===================================================== */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        function () {

            window.history.back();

        }
    );

        "click",

            alert("Settings");

        }
    );


/* =====================================================
   INITIAL LOAD
   ===================================================== */

renderNotifications();
    </script>
